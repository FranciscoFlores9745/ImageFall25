<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!--Snowman1-->
      <a-box position="-0 6.25 -4" rotation="0 0 0" color="#000000"></a-box>
      <a-box position="-0 5.5 -4"  width="2" height=".5" length="2" rotation="0 0 0" color="#000000"></a-box>

      <a-sphere position="0 1.25 -4" radius="1.25" color="#ECECEC"></a-sphere>
      <a-sphere position="0 2.5 -4" radius="1.0" color="#ECECEC"></a-sphere>
      <a-sphere position="0 3.75 -4" radius="0.75" color="#ECECEC"></a-sphere>
      <a-sphere position="0 5 -4" radius="0.5" color="#ECECEC"></a-sphere>

      <a-sphere position="0 1.5 -2.75" radius="0.1" color="#000000"></a-sphere>
      <a-sphere position="0 2.5 -3" radius="0.1" color="#000000"></a-sphere>
      <a-sphere position="0 3.75 -3.25" radius="0.1" color="#000000"></a-sphere>

      <a-cylinder position="1 3.5 -4"  rotation ="-45 0 90" radius="0.125" height="1.5" color="#FFC65D"  ></a-cylinder>
      <a-cylinder position="-1 3.5 -4"  rotation ="-45 0 90" radius="0.125" height="1.5" color="#FFC65D"></a-cylinder>

      <a-cone position="0 5 -3.25" rotation = " 90 0 0"  radius-bottom="0.1" radius-top="0.01" width="0.005" height="2" color="orange" ></a-cone>

      <!--Snowman2-->
     <a-box position="3 6.25 -5" rotation="0 0 0" color="#000000"></a-box>
      <a-box position="3 5.5 -5"  width="2" height=".5" length="2" rotation="0 0 0" color="#000000"></a-box>

      <a-sphere position="3 .5 -5" radius=".5" color="#ECECEC"></a-sphere>
      <a-sphere position="3 1.0 -5" radius=".375" color="#ECECEC"></a-sphere>
      <a-sphere position="3 1.5 -5" radius="0.25" color="#ECECEC"></a-sphere>
      <a-sphere position="3 1.875 -5" radius="0.125" color="#ECECEC"></a-sphere>

      <a-sphere position="3 .5 -5" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="3 1.0 -4.625" radius="0.05" color="#000000"></a-sphere>
      <a-sphere position="3 1.5 -4.75" radius="0.05" color="#000000"></a-sphere>

      <a-cylinder position="4 3.5 -5"  rotation ="-45 0 90" radius="0.125" height="1.5" color="#FFC65D"  ></a-cylinder>
      <a-cylinder position="2 3.5 -5"  rotation ="-45 0 90" radius="0.125" height="1.5" color="#FFC65D"></a-cylinder>

      <a-cone position="3 5 -4.25" rotation = " 90 0 0"  radius-bottom="0.1" radius-top="0.01" width="0.005" height="2" color="orange" ></a-cone>








      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: checkerboard; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
